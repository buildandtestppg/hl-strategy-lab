<!--
  Fleet Intelligence Feed — Embeddable Component
  Insert this into the main dashboard (index.html) to add a "Fleet" tab.

  INSTRUCTIONS:
  1. Add fleet_feed.css to <head>
  2. Add the Fleet page HTML before </div>.container
  3. Add "Fleet" nav tab
  4. Add fleet_feed.js before </body>
  5. Add renderFleet(data) call in the render() function
-->

<!-- ── STEP 1: Add to <head> ──
<link rel="stylesheet" href="fleet_feed.css">
-->

<style id="fleet-feed-inline-css">
/* ── Fleet Feed Inline Styles ──────────────────────────────────────── */
.status-bar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.status-chip{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:10px 16px;flex:1;min-width:180px;cursor:pointer;
  transition:all 0.2s;user-select:none;
}
.status-chip:hover{border-color:var(--muted);}
.status-chip.dimmed{opacity:0.35;}
.status-icon{font-size:20px;}
.status-info{flex:1;}
.status-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;}
.status-time{font-size:11px;color:var(--muted);}
.status-count{font-size:18px;font-weight:800;background:var(--surface2);border-radius:8px;padding:4px 10px;}

.feed-item{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:14px 16px;margin-bottom:8px;
  border-left:4px solid var(--border);transition:all 0.25s ease;
  animation:feedIn 0.3s ease;
}
@keyframes feedIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.feed-item:hover{background:var(--surface2);}
.feed-item.bullish{border-left-color:var(--green);background:rgba(0,217,163,0.06);}
.feed-item.bearish{border-left-color:var(--red);background:rgba(255,71,87,0.06);}
.feed-item.neutral{border-left-color:var(--gold);background:rgba(255,184,0,0.06);}

.feed-row{display:flex;align-items:flex-start;gap:10px;}
.feed-icon{font-size:16px;flex-shrink:0;padding-top:2px;}
.feed-body{flex:1;min-width:0;}
.feed-meta{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap;}
.feed-source-tag{font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:4px;letter-spacing:0.3px;}
.feed-source-tag.x_scanner{background:var(--blue);color:#000;}
.feed-source-tag.whale_monitor{background:var(--purple);color:#fff;}
.feed-source-tag.news_agent{background:var(--gold);color:#000;}
.feed-sentiment-tag{font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:4px;letter-spacing:0.3px;}
.feed-sentiment-tag.bullish{color:var(--green);border:1px solid rgba(0,217,163,0.3);}
.feed-sentiment-tag.bearish{color:var(--red);border:1px solid rgba(255,71,87,0.3);}
.feed-sentiment-tag.neutral{color:var(--gold);border:1px solid rgba(255,184,0,0.3);}
.feed-time{font-size:11px;color:var(--muted);}
.feed-coins{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;}
.coin-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--surface2);border:1px solid var(--border);}
.feed-title-text{font-size:13px;line-height:1.5;word-break:break-word;}
.feed-detail{font-size:11px;color:var(--muted);margin-top:3px;font-family:monospace;}
.feed-score{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--surface2);border:1px solid var(--border);margin-left:6px;}

.filter-bar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.filter-btn{padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:var(--surface);border:1px solid var(--border);color:var(--muted);transition:all 0.2s;user-select:none;}
.filter-btn:hover{color:var(--text);border-color:var(--muted);}
.filter-btn.active{background:var(--surface2);color:var(--green);border-color:var(--green);}

.fleet-refresh{display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;color:var(--muted);padding:10px;margin-bottom:10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;}
.fleet-empty{text-align:center;padding:40px;color:var(--muted);font-size:13px;}
</style>

<script id="fleet-feed-inline-js">
// ── Fleet Feed Module ────────────────────────────────────────────────
(function() {
  const FEED_URL = 'https://raw.githubusercontent.com/buildandtestppg/hl-strategy-lab/gh-pages/fleet_feed.json';
  const REFRESH_MS = 30000;
  const MAX_ITEMS = 50;
  const STALE_MIN = 45;

  let fleetData = null;
  let fleetSources = new Set(['x_scanner', 'whale_monitor', 'news_agent']);
  let fleetFilter = 'all';
  let fleetCountdown = REFRESH_MS;

  function fleetTimeAgo(iso) {
    if (!iso) return 'N/A';
    const m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 1) return 'now';
    if (m < 60) return m + 'm';
    if (m < 1440) return Math.floor(m/60) + 'h';
    return Math.floor(m/1440) + 'd';
  }

  function fleetFmtTime(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
  }

  function fleetSourceAge(ts) {
    if (!ts) return 'dead';
    const m = (Date.now() - new Date(ts).getTime()) / 60000;
    if (m <= STALE_MIN) return 'live';
    if (m <= STALE_MIN * 2) return 'stale';
    return 'dead';
  }

  function fleetEscape(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Expose to global scope
  window.fleetToggleSource = function(src) {
    if (fleetSources.has(src)) { if (fleetSources.size <= 1) return; fleetSources.delete(src); }
    else fleetSources.add(src);
    if (fleetData) { fleetRender(); }
  };

  window.fleetSetFilter = function(f) {
    fleetFilter = f;
    const bar = document.getElementById('fleetFilterBar');
    if (bar) {
      bar.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active',
          (f === 'all' && b.textContent === 'All') ||
          (f === 'bullish' && b.textContent.includes('Bullish')) ||
          (f === 'bearish' && b.textContent.includes('Bearish')) ||
          (f === 'neutral' && b.textContent.includes('Neutral')) ||
          (f === 'x_scanner' && b.textContent.includes('X Scanner')) ||
          (f === 'whale_monitor' && b.textContent.includes('Whale')) ||
          (f === 'news_agent' && b.textContent.includes('News'))
        );
      });
    }
    if (fleetData) fleetRender();
  };

  function fleetRender() {
    // Status bar
    const statusBar = document.getElementById('fleetStatusBar');
    if (statusBar && fleetData) {
      const icons = {x_scanner:'📡',whale_monitor:'🐋',news_agent:'📰'};
      const labels = {x_scanner:'X Scanner',whale_monitor:'Whale Monitor',news_agent:'News Agent'};
      const scheds = {x_scanner:'30min',whale_monitor:'20min',news_agent:'15min'};
      statusBar.innerHTML = Object.entries(fleetData.sources).map(([k,info]) => {
        const dim = fleetSources.has(k) ? '' : 'dimmed';
        return `<div class="status-chip ${dim}" onclick="fleetToggleSource('${k}')">
          <span class="status-icon">${icons[k]}</span>
          <div class="status-info"><div class="status-label">${labels[k]}</div>
          <div class="status-time">${fleetTimeAgo(info.last_run)} · ${scheds[k]}</div></div>
          <div class="status-count">${info.items_count}</div></div>`;
      }).join('');
    }

    // Feed
    const container = document.getElementById('fleetFeed');
    if (!container || !fleetData) return;

    const items = (fleetData.feed || []).filter(item => {
      if (!fleetSources.has(item.source)) return false;
      if (fleetFilter === 'all') return true;
      if (['bullish','bearish','neutral'].includes(fleetFilter)) return item.sentiment === fleetFilter;
      return item.source === fleetFilter;
    }).slice(0, MAX_ITEMS);

    if (items.length === 0) {
      container.innerHTML = '<div class="fleet-empty">No items match current filters</div>';
      return;
    }

    container.innerHTML = items.map(item => {
      const s = item.sentiment || 'neutral';
      const coins = (item.coins||[]).map(c=>`<span class="coin-tag">$${c}</span>`).join('');
      const score = item.score != null
        ? `<span class="feed-score">${item.score.toFixed(1)}</span>` : '';
      const detail = item.detail ? `<div class="feed-detail">${fleetEscape(item.detail)}</div>` : '';
      const srcLabel = item.source==='x_scanner'?'X SCAN':item.source==='whale_monitor'?'WHALE':'NEWS';
      const sentLabel = s==='bullish'?'▲ BULLISH':s==='bearish'?'▼ BEARISH':'● NEUTRAL';
      return `<div class="feed-item ${s}">
        <div class="feed-row">
          <span class="feed-icon">${item.icon||'📌'}</span>
          <div class="feed-body">
            <div class="feed-meta">
              <span class="feed-source-tag ${item.source}">${srcLabel}</span>
              <span class="feed-sentiment-tag ${s}">${sentLabel}</span>
              <span class="feed-time">${fleetFmtTime(item.timestamp)} · ${fleetTimeAgo(item.timestamp)}</span>
              ${score}<span class="feed-coins">${coins}</span>
            </div>
            <div class="feed-title-text">${fleetEscape(item.title)}</div>
            ${detail}
          </div>
        </div></div>`;
    }).join('');
  }

  async function fleetLoad() {
    try {
      const r = await fetch(FEED_URL + '?t=' + Date.now());
      if (!r.ok) throw new Error(r.status);
      fleetData = await r.json();
      if (document.getElementById('fleetGenTime'))
        document.getElementById('fleetGenTime').textContent = 'Updated: ' + fleetTimeAgo(fleetData.generated_at);
      fleetRender();
    } catch(e) {
      console.error('Fleet feed error:', e);
    }
  }

  // Timer
  setInterval(() => {
    fleetCountdown -= 1000;
    if (fleetCountdown <= 0) { fleetCountdown = REFRESH_MS; fleetLoad(); }
    const el = document.getElementById('fleetRefreshText');
    if (el) el.textContent = 'Next refresh in ' + Math.ceil(fleetCountdown/1000) + 's';
  }, 1000);

  // Initial load
  fleetLoad();
  // Also refresh every interval
  setInterval(fleetLoad, REFRESH_MS);

  // Expose for dashboard integration
  window.fleetFeedReady = true;
})();
</script>
