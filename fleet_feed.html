<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Intelligence Feed — HL Strategy Lab</title>
<style>
/* ── Reset & Base ──────────────────────────────────────────────────────── */
:root {
  --bg:#0a0a0f; --surface:#12121a; --surface2:#1a1a25;
  --border:#2a2a3a; --text:#e4e4e7; --muted:#6b6b80;
  --green:#00d9a3; --green-dim:rgba(0,217,163,0.08); --green-border:rgba(0,217,163,0.25);
  --red:#ff4757; --red-dim:rgba(255,71,87,0.08); --red-border:rgba(255,71,87,0.25);
  --gold:#ffb800; --gold-dim:rgba(255,184,0,0.08); --gold-border:rgba(255,184,0,0.25);
  --blue:#4d8eff; --purple:#a855f7;
  --font:-apple-system,'Segoe UI',system-ui,sans-serif;
  --mono:'SF Mono','Fira Code','Cascadia Code',monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;}

/* ── Nav ──────────────────────────────────────────────────────────────── */
.nav{
  position:sticky;top:0;z-index:100;background:var(--surface);
  border-bottom:1px solid var(--border);padding:12px 20px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.nav-brand{font-weight:800;font-size:16px;}
.nav-live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--green);}
.live-dot{width:8px;height:8px;background:var(--green);border-radius:50%;animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.nav-right{display:flex;align-items:center;gap:12px;margin-left:auto;}
.source-badge{
  display:flex;align-items:center;gap:4px;padding:4px 10px;
  border-radius:6px;font-size:11px;font-weight:600;
  background:var(--surface2);border:1px solid var(--border);cursor:pointer;
  transition:all 0.2s;user-select:none;
}
.source-badge:hover{border-color:var(--muted);}
.source-badge.active{border-color:var(--green);color:var(--green);}
.source-badge .dot{width:6px;height:6px;border-radius:50%;}
.source-badge .dot.live{background:var(--green);animation:blink 1.5s infinite;}
.source-badge .dot.stale{background:var(--gold);}
.source-badge .dot.dead{background:var(--red);}

/* ── Container ────────────────────────────────────────────────────────── */
.container{max-width:960px;margin:0 auto;padding:20px 16px;}

/* ── Source Status Bar ─────────────────────────────────────────────────── */
.status-bar{
  display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;
}
.status-chip{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:10px 16px;flex:1;min-width:200px;
}
.status-icon{font-size:20px;}
.status-info{flex:1;}
.status-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;}
.status-time{font-size:11px;color:var(--muted);}
.status-count{
  font-size:18px;font-weight:800;
  background:var(--surface2);border-radius:8px;padding:4px 10px;
}

/* ── Feed ──────────────────────────────────────────────────────────────── */
.feed-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;
}
.feed-title{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
.feed-count{font-size:12px;color:var(--muted);background:var(--surface);padding:4px 10px;border-radius:6px;}

/* ── Feed Card ──────────────────────────────────────────────────────────── */
.feed-item{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:16px;margin-bottom:8px;
  border-left:4px solid var(--border);
  transition:all 0.25s ease;
  animation:fadeIn 0.3s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.feed-item:hover{background:var(--surface2);border-color:var(--muted);}

/* Sentiment borders */
.feed-item.bullish{border-left-color:var(--green);background:var(--green-dim);}
.feed-item.bearish{border-left-color:var(--red);background:var(--red-dim);}
.feed-item.neutral{border-left-color:var(--gold);background:var(--gold-dim);}

.feed-item.bullish:hover{border-color:var(--green-border);}
.feed-item.bearish:hover{border-color:var(--red-border);}
.feed-item.neutral:hover{border-color:var(--gold-border);}

.feed-row{display:flex;align-items:flex-start;gap:12px;}
.feed-icon{font-size:18px;flex-shrink:0;padding-top:2px;}
.feed-body{flex:1;min-width:0;}
.feed-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
.feed-source-tag{
  font-size:10px;font-weight:700;text-transform:uppercase;
  padding:2px 8px;border-radius:4px;letter-spacing:0.3px;
}
.feed-source-tag.x_scanner{background:var(--blue);color:#000;}
.feed-source-tag.whale_monitor{background:var(--purple);color:#fff;}
.feed-source-tag.news_agent{background:var(--gold);color:#000;}

.feed-sentiment-tag{
  font-size:10px;font-weight:700;text-transform:uppercase;
  padding:2px 8px;border-radius:4px;letter-spacing:0.3px;
}
.feed-sentiment-tag.bullish{background:var(--green-dim);color:var(--green);border:1px solid var(--green-border);}
.feed-sentiment-tag.bearish{background:var(--red-dim);color:var(--red);border:1px solid var(--red-border);}
.feed-sentiment-tag.neutral{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-border);}

.feed-time{font-size:11px;color:var(--muted);}
.feed-coins{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;}
.coin-tag{
  font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;
  background:var(--surface2);border:1px solid var(--border);
}
.feed-title-text{font-size:13px;line-height:1.5;word-break:break-word;}
.feed-detail{font-size:11px;color:var(--muted);margin-top:4px;font-family:var(--mono);}
.feed-score{
  font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;
  background:var(--surface2);border:1px solid var(--border);margin-left:8px;
}
.feed-score.high{color:var(--green);border-color:var(--green-border);}
.feed-score.low{color:var(--muted);}

/* ── Empty State ───────────────────────────────────────────────────────── */
.empty-state{
  text-align:center;padding:60px 20px;color:var(--muted);
}
.empty-state .icon{font-size:48px;margin-bottom:16px;}
.empty-state p{font-size:14px;}

/* ── Loading ────────────────────────────────────────────────────────────── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px;color:var(--muted);}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Filter Bar ────────────────────────────────────────────────────────── */
.filter-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.filter-btn{
  padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;
  cursor:pointer;background:var(--surface);border:1px solid var(--border);
  color:var(--muted);transition:all 0.2s;user-select:none;
}
.filter-btn:hover{color:var(--text);border-color:var(--muted);}
.filter-btn.active{background:var(--surface2);color:var(--green);border-color:var(--green);}
.filter-btn.active-bullish{color:var(--green);border-color:var(--green);background:var(--green-dim);}
.filter-btn.active-bearish{color:var(--red);border-color:var(--red);background:var(--red-dim);}
.filter-btn.active-neutral{color:var(--gold);border-color:var(--gold);background:var(--gold-dim);}

/* ── Refresh indicator ──────────────────────────────────────────────────── */
.refresh-bar{
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:11px;color:var(--muted);padding:12px;margin-bottom:12px;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
}

/* ── Footer ─────────────────────────────────────────────────────────────── */
.footer{text-align:center;padding:24px;border-top:1px solid var(--border);color:var(--muted);font-size:12px;}

/* ── Responsive ──────────────────────────────────────────────────────────── */
@media(max-width:600px){
  .status-bar{flex-direction:column;}
  .feed-coins{margin-left:0;margin-top:4px;}
  .feed-meta{gap:4px;}
}
</style>
</head>
<body>

<!-- Nav -->
<div class="nav">
  <div class="nav-brand">🛰️ Fleet Intel Feed</div>
  <div class="nav-live"><span class="live-dot"></span> <span id="navStatus">Loading...</span></div>
  <div class="nav-right">
    <div class="source-badge" onclick="toggleSource('x_scanner')" id="badge-x_scanner">
      <span class="dot" id="dot-x_scanner"></span> 📡 X
    </div>
    <div class="source-badge" onclick="toggleSource('whale_monitor')" id="badge-whale_monitor">
      <span class="dot" id="dot-whale_monitor"></span> 🐋 Whale
    </div>
    <div class="source-badge" onclick="toggleSource('news_agent')" id="badge-news_agent">
      <span class="dot" id="dot-news_agent"></span> 📰 News
    </div>
  </div>
</div>

<div class="container">
  <!-- Loading -->
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Connecting to fleet...</p>
  </div>

  <!-- Main Content (hidden until loaded) -->
  <div id="mainContent" style="display:none;">

    <!-- Source Status Bar -->
    <div class="status-bar" id="statusBar"></div>

    <!-- Refresh Bar -->
    <div class="refresh-bar" id="refreshBar">
      <span class="live-dot"></span>
      <span id="refreshText">Next refresh in 30s</span>
      <span style="margin-left:auto;" id="genTime"></span>
    </div>

    <!-- Filters -->
    <div class="filter-bar" id="filterBar">
      <div class="filter-btn active" onclick="setFilter('all')">All</div>
      <div class="filter-btn" onclick="setFilter('bullish')">🟢 Bullish</div>
      <div class="filter-btn" onclick="setFilter('bearish')">🔴 Bearish</div>
      <div class="filter-btn" onclick="setFilter('neutral')">🟡 Neutral</div>
      <div class="filter-btn" onclick="setFilter('x_scanner')">📡 X Scanner</div>
      <div class="filter-btn" onclick="setFilter('whale_monitor')">🐋 Whale</div>
      <div class="filter-btn" onclick="setFilter('news_agent')">📰 News</div>
    </div>

    <!-- Feed Header -->
    <div class="feed-header">
      <div class="feed-title">Live Intelligence Feed</div>
      <div class="feed-count" id="feedCount">0 items</div>
    </div>

    <!-- Feed Items -->
    <div id="feedContainer"></div>
  </div>
</div>

<div class="footer">Fleet Intelligence Feed — HL Strategy Lab</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────
const FEED_URL = 'https://raw.githubusercontent.com/buildandtestppg/hl-strategy-lab/gh-pages/fleet_feed.json';
const REFRESH_INTERVAL = 30000; // 30 seconds
const MAX_ITEMS = 50;
const STALE_MINUTES = 45;

// ── State ────────────────────────────────────────────────────────────────
let feedData = null;
let activeSources = new Set(['x_scanner', 'whale_monitor', 'news_agent']);
let activeFilter = 'all';
let refreshCountdown = REFRESH_INTERVAL;

// ── Time Formatting ─────────────────────────────────────────────────────
function timeAgo(isoStr) {
  if (!isoStr) return 'N/A';
  const now = new Date();
  const then = new Date(isoStr);
  const diffMs = now - then;
  const diffMin = Math.floor(diffMs / 60000);
  if (diffMin < 1) return 'just now';
  if (diffMin < 60) return `${diffMin}m ago`;
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return `${diffHr}h ${diffMin % 60}m ago`;
  return `${Math.floor(diffHr / 24)}d ago`;
}

function fmtTime(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
}

// ── Source Age Classification ───────────────────────────────────────────
function sourceAge(timestamp) {
  if (!timestamp) return 'dead';
  const diffMin = (Date.now() - new Date(timestamp).getTime()) / 60000;
  if (diffMin <= STALE_MINUTES) return 'live';
  if (diffMin <= STALE_MINUTES * 2) return 'stale';
  return 'dead';
}

// ── Render Status Bar ─────────────────────────────────────────────────────
function renderStatusBar(sources) {
  const icons = { x_scanner: '📡', whale_monitor: '🐋', news_agent: '📰' };
  const labels = { x_scanner: 'X Scanner', whale_monitor: 'Whale Monitor', news_agent: 'News Agent' };
  const schedules = { x_scanner: '30min', whale_monitor: '20min', news_agent: '15min' };

  document.getElementById('statusBar').innerHTML = Object.entries(sources).map(([key, info]) => {
    const age = sourceAge(info.last_run);
    const ageLabel = info.last_run ? timeAgo(info.last_run) : 'never';
    return `
      <div class="status-chip" onclick="toggleSource('${key}')" style="cursor:pointer;opacity:${activeSources.has(key)?'1':'0.4'}">
        <span class="status-icon">${icons[key]}</span>
        <div class="status-info">
          <div class="status-label">${labels[key]}</div>
          <div class="status-time">${ageLabel} · ${schedules[key]} cycle</div>
        </div>
        <div class="status-count">${info.items_count}</div>
      </div>`;
  }).join('');

  // Update nav dots
  Object.keys(sources).forEach(key => {
    const age = sourceAge(sources[key].last_run);
    const dot = document.getElementById(`dot-${key}`);
    if (dot) {
      dot.className = 'dot ' + age;
    }
    const badge = document.getElementById(`badge-${key}`);
    if (badge) {
      badge.classList.toggle('active', activeSources.has(key));
    }
  });
}

// ── Render Feed Items ───────────────────────────────────────────────────
function renderFeed(data) {
  const container = document.getElementById('feedContainer');
  const items = data.feed || [];

  // Filter
  const filtered = items.filter(item => {
    if (!activeSources.has(item.source)) return false;
    if (activeFilter === 'all') return true;
    if (activeFilter === 'bullish' || activeFilter === 'bearish' || activeFilter === 'neutral') {
      return item.sentiment === activeFilter;
    }
    return item.source === activeFilter;
  }).slice(0, MAX_ITEMS);

  document.getElementById('feedCount').textContent = `${filtered.length} items`;

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">🔍</div>
        <p>No items match current filters</p>
      </div>`;
    return;
  }

  container.innerHTML = filtered.map(item => {
    const sentiment = item.sentiment || 'neutral';
    const coins = (item.coins || []).map(c =>
      `<span class="coin-tag">$${c}</span>`
    ).join('');
    const scoreHtml = item.score != null
      ? `<span class="feed-score ${item.score >= 7 ? 'high' : 'low'}">${item.score.toFixed(1)}</span>`
      : '';
    const detailHtml = item.detail
      ? `<div class="feed-detail">${escapeHtml(item.detail)}</div>`
      : '';

    return `
      <div class="feed-item ${sentiment}">
        <div class="feed-row">
          <span class="feed-icon">${item.icon || '📌'}</span>
          <div class="feed-body">
            <div class="feed-meta">
              <span class="feed-source-tag ${item.source}">${
                item.source === 'x_scanner' ? 'X SCAN' :
                item.source === 'whale_monitor' ? 'WHALE' : 'NEWS'
              }</span>
              <span class="feed-sentiment-tag ${sentiment}">${
                sentiment === 'bullish' ? '▲ BULLISH' :
                sentiment === 'bearish' ? '▼ BEARISH' : '● NEUTRAL'
              }</span>
              <span class="feed-time">${fmtTime(item.timestamp)} · ${timeAgo(item.timestamp)}</span>
              ${scoreHtml}
              <span class="feed-coins">${coins}</span>
            </div>
            <div class="feed-title-text">${escapeHtml(item.title)}</div>
            ${detailHtml}
          </div>
        </div>
      </div>`;
  }).join('');
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Source Toggle ─────────────────────────────────────────────────────────
function toggleSource(source) {
  if (activeSources.has(source)) {
    // Don't allow deselecting all
    if (activeSources.size <= 1) return;
    activeSources.delete(source);
  } else {
    activeSources.add(source);
  }
  if (feedData) {
    renderStatusBar(feedData.sources);
    renderFeed(feedData);
  }
}

// ── Filter ──────────────────────────────────────────────────────────────
function setFilter(filter) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.className = 'filter-btn';
    if (btn.textContent.toLowerCase().includes(filter) || (filter === 'all' && btn.textContent === 'All')) {
      btn.classList.add('active');
      if (filter === 'bullish') btn.classList.add('active-bullish');
      else if (filter === 'bearish') btn.classList.add('active-bearish');
      else if (filter === 'neutral') btn.classList.add('active-neutral');
    }
  });
  if (feedData) renderFeed(feedData);
}

// ── Refresh Timer ─────────────────────────────────────────────────────────
function startRefreshTimer() {
  setInterval(() => {
    refreshCountdown -= 1000;
    if (refreshCountdown <= 0) {
      refreshCountdown = REFRESH_INTERVAL;
      loadFeed();
    }
    const secs = Math.ceil(refreshCountdown / 1000);
    document.getElementById('refreshText').textContent = `Next refresh in ${secs}s`;
  }, 1000);
}

// ── Load Feed ─────────────────────────────────────────────────────────────
async function loadFeed() {
  try {
    const r = await fetch(FEED_URL + '?t=' + Date.now());
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    feedData = await r.json();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';

    document.getElementById('navStatus').textContent = `${feedData.total_items} signals · ${timeAgo(feedData.generated_at)}`;
    document.getElementById('genTime').textContent = `Generated: ${timeAgo(feedData.generated_at)}`;

    renderStatusBar(feedData.sources);
    renderFeed(feedData);
  } catch (e) {
    console.error('Feed load failed:', e);
    document.getElementById('navStatus').textContent = 'Connection error';
  }
}

// ── Init ─────────────────────────────────────────────────────────────────
loadFeed();
startRefreshTimer();
</script>
</body>
</html>
